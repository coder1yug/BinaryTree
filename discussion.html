<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discussion Board - BinaryTree</title>
  <link rel="stylesheet" href="discussion.css">
</head>
<body>
  <div class="chat-container">
    <h1 style="color: white; text-align: center;">Discussion Board</h1>
    <div class="chat-wrapper">
      <div class="discussion-topics" id="discussion-topics"></div>

      <div class="chat-input">
        <textarea id="topic-input" placeholder="Start a new topic..."></textarea>
        <button id="add-topic-btn">Post Topic</button>
      </div>
    </div>
  </div>

  <script src="discussion.js"></script>
</body>
</html>
